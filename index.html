<!DOCTYPE html>

<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <a href="mailto:info@example.com" class="floating-btn floating-btn-email" title="Написать">

    <a href="https://wa.me/79267313545" target="_blank" class="floating-btn floating-btn-whatsapp" title="WhatsApp">

    <a href="skype:example?chat" target="_blank" class="floating-btn floating-btn-skype" title="Skype">

        </svg>
        <span class="tooltip">Skype</span>

</div>

<div class="container">
    <div class="header fade-in">
        <div class="logo-container">
            <img src="logo-full.svg" alt="PHP-WP Checker" class="logo-full">
        </div>

        <div class="site-title">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            PHP-WP Cheker
        </div>

        <h1>Мониторинг безопасности</h1>
        <p class="subtitle">Анализ WordPress и PHP в реальном времени</p>

        <!-- Кнопка Telegram бота в шапке -->
        <div class="telegram-bot-header">
            <a href="https://t.me/php_wp_cheker_bot" target="_blank" class="telegram-bot-header-btn">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
                <div class="telegram-bot-header-text">
                    <span class="telegram-bot-header-title">Проверить сайты в Telegram</span>
<!--                    <span class="telegram-bot-header-username">@php_wp_cheker_bot</span>-->
                </div>
                <svg class="icon icon-sm arrow-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-pill">
                <span class="status-dot"></span>
                WordPress <strong id="wpLatest">Загрузка...</strong>
            </div>
            <div class="status-pill">
                <span class="status-dot"></span>
                PHP <strong id="phpLatest">Загрузка...</strong>
            </div>
        </div>
        <div class="update-info" id="updateInfo"></div>
    </div>

    <div class="card fade-in">
        <div class="card-header">
            <div class="card-icon">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <h2>Проверка сайтов</h2>

            <div class="card-actions" id="cardActions" style="display: none;">
                <button class="btn btn-sm btn-success" id="exportPdfBtn" title="Скачать PDF">
                    <svg class="icon icon-sm" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/>
                    </svg>
                    <span>Создать PDF</span>
                </button>
<!--                <button class="btn btn-sm btn-primary" id="emailBtn" title="Отправить на Email">-->
<!--                    <svg class="icon icon-sm" viewBox="0 0 24 24">-->
<!--                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>-->
<!--                        <path d="M22 6l-10 7L2 6"/>-->
<!--                    </svg>-->
<!--                    <span>Email</span>-->
<!--                </button>-->
            </div>
        </div>
        <textarea id="urls" placeholder="https://example.com&#10;https://mysite.org&#10;example.net"></textarea>
        <div class="btn-group">
            <button class="btn btn-primary" id="checkBtn">
                <svg class="icon icon-sm" viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                Начать проверку
            </button>
            <button class="btn btn-secondary" id="clearBtn">
                <svg class="icon icon-sm" viewBox="0 0 24 24">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
                Очистить
            </button>
        </div>
    </div>

    <div id="results"></div>

    <div id="versionInfoBlocks" style="display: none;">
        <div class="version-info-grid">
            <div class="version-info-card">
                <div class="version-info-header">
                    <div class="version-badge-large">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="version-title">WordPress</div>
                        <div class="version-number" id="wpVersionNumber"></div>
                    </div>
                </div>
                <div id="wordpressInfo"></div>
            </div>

            <div class="version-info-card">
                <div class="version-info-header">
                    <div class="version-badge-large">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13 5l-2 14"/>
                        </svg>
                    </div>
                    <div>
                        <div class="version-title">PHP</div>
                        <div class="version-number" id="phpVersionNumber"></div>
                    </div>
                </div>
                <div id="phpInfo"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="emailModal">
    <div class="modal">
        <h3>Отправить отчет на Email</h3>
        <input type="email" id="emailInput" placeholder="Введите email адрес">
        <div class="btn-group">
            <button class="btn btn-primary" id="sendEmailBtn">Отправить</button>
            <button class="btn btn-secondary" id="cancelEmailBtn">Отмена</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
